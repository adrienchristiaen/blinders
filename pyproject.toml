[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blinders"
version = "0.10.0"
description = "Launch agent CLIs (Claude Code, Gemini CLI, Codex, Mistral Vibe) blind by default, then open only the repos a prompt needs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ['tomli>=2.0; python_version < "3.11"']

[project.optional-dependencies]
ui = ["textual>=8.2,<9"]

[project.scripts]
blind = "blinders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
